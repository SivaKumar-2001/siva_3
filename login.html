<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Ice Cream Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fceabb, #f8b500);
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
      padding-left: 0px;
      text-align: center;
      justify-content: center;
    }

    .login-box h2 {
      margin-bottom: 20px;
      color: #f78da7;
      font-size: 28px;
    }

    .login-box img {
      width: 80px;
      margin-bottom: 15px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #f8b500;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    .login-box input:focus {
      border-color: #f78da7;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: #f78da7;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-box button:hover {
      background: #f5597b;
    }

    .login-box p {
      margin-top: 15px;
      font-size: 14px;
      color: #333;
    }

    .login-box a {
      color: #f78da7;
      text-decoration: none;
      font-weight: bold;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .footer {
      background-color: #ff6f91;
      color: white;
      padding: 40px 20px 20px;
    }

    .footer-container {
      display: flex;
      justify-content: space-between;
      max-width: 1100px;
      margin: auto;
      flex-wrap: wrap;
    }

    .footer h3 {
      color: #1da1f2;
      margin-bottom: 15px;
    }

    .footer p, 
    .footer a {
      color: white;
      text-decoration: none;
      margin: 5px 0;
      display: block;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .footer-bottom {
      text-align: center;
      padding-top: 20px;
      margin-top: 20px;
      border-top: 1px solid #3c5a77;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="logo">
            <img src="Images/Logo.JPG"  class="image">
                <div>
                    <h1 style="color: white; font-size: 60px;">Siri Vennela Ice cream</h1>
                    <div class="button2">
                        <div>
                            <button onclick="window.location.href='home.html'"  class="button1">
                                Home
                            </button>
                        </div>
                        <div>
                            <button onclick="window.location.href='about.html'"  class="button1">
                                About
                            </button>
                        </div>
                        <div>
                            <button onclick="window.location.href='contact.html'"  class="button1">
                                 Contact
                            </button>
                        </div>
                        <div>
                             <button onclick="window.location.href='login.html'"  class="button1">
                                Login
                            </button>
                        </div>
                    </div>
                </div>
</div>
  <hr>
  <div class="login-box">
    <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png" alt="Ice Cream Logo">
    <h2>Welcome Back!</h2>
    <form  onsubmit="showMessage(event)">
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <script>
        function showMessage(event) {
        event.preventDefault(); 
        alert("Your message has been sent successfully!");
      }
    </script>
    <p>Don’t have an account? <a href="sinup.html">Sign up</a></p>
  </div>
  <footer class="footer">
    <div class="footer-container">
      <div>
        <h3>Delicious Ice</h3>
        <p>Commercial Ice cream services since 2001</p>
      </div>
      <div>
        <h3>Quick Links</h3>
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <div>
        <h3>Contact Us</h3>
        <p>thirumalasettysivakumar2001@gmail.com</p>
        <p>8978026697</p>
      </div>
    </div>
  </footer>
  <footer class="footer">
    <p>&copy; 2025 Sweet Treats Ice Cream | Made with ❤️</p>
  </footer>
</body>
</html>
